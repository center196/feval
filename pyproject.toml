[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feval"
version = "1.0.0"
description = "Reference miner/validator CLI for a cheap-to-verify Feval LoRA subnet."
requires-python = ">=3.10"
dependencies = [
  "bittensor==11.1.0",
  "datasets==5.0.1",
  "huggingface-hub==1.28.0",
  "pyarrow>=17,<23",
  "safetensors==0.8.0",
  "transformers==5.15.0",
  "typer==0.27.1",
  "vllm==0.27.1; platform_system == 'Linux'",
  "wandb>=0.17,<1",
]

[project.scripts]
feval = "feval.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["feval*"]


